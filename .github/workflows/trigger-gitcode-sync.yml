# GitCode 同步触发工作流（由 gitcode-sync-config 自动安装）
# 前置条件：组织级 Secrets 配置 APP_ID、APP_PRIVATE_KEY

name: Trigger GitCode Sync

on:
  push:
    branches: ["**"]
  delete:
    branches: ["**"]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: NonsensicalHub

      - name: Dispatch sync to central repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after || github.sha }}"
          REF="${{ github.ref }}"
          PAYLOAD=$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg event "${{ github.event_name }}" \
            --arg before "$BEFORE" \
            --arg after "$AFTER" \
            --arg ref "$REF" \
            '{repo:$repo,event:$event,before:$before,after:$after,ref:$ref}')
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NonsensicalHub/gitcode-sync-config/dispatches" \
            -d "{\"event_type\":\"sync\",\"client_payload\":$PAYLOAD}"
